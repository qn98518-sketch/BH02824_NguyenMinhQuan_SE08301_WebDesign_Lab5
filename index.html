<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        box-sizing: border-box;
    }

    body{
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    nav{
        display: flex;
        background-color: orange;
        margin: 0px;
        padding: 0px;
    }

    nav ul{
        list-style: none;
        display: flex;
        padding: 0px;
        margin: 0px;
    }

    nav ul li{
        position: relative;
        padding: 0px 15px;
        border: 1px solid black;
        width: 100px;
        height: 50px;
        background-color: lightblue;
    }

    nav ul > li > .column{
        display: flex;
        flex-direction: column;
        display: none;
    }

    nav ul li .column2 {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 100%;
        background-color: lightgreen;
    }

    nav ul li:hover > .column {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        background-color: lightgreen;
    }

    nav ul li:hover > .column2 {
        display: flex;
    }

    nav ul li:hover > ul.column2 {
        display: flex;
    }

     
</style>
<body>
    <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Web Design</a>
        <ul class="column">
          <li><a href="#">Resources</a></li>
          <li><a href="#">Links</a></li>
          <li><a href="#">Tutorials</a>
            <ul class="column2">
              <li><a href="#">HTML/CSS</a></li>
              <li><a href="#">jQuery</a></li>
            </ul>
          </li>
        </ul>
      </li>
      <li><a href="#">Contact</a></li>
      <li><a href="#">About</a></li>
    </ul>
  </nav>
</body>
</html>
